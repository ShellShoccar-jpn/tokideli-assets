<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-label="tokideli">
  <rect width="900" height="190" rx="14" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="188" rx="13" fill="none" stroke="#30363d" stroke-width="2"/>

  <!-- delivery rider icon: a cyclist carrying a stopwatch like a food-delivery backpack -->
  <g transform="translate(10,12) scale(0.72)">
    <!-- bicycle -->
    <g fill="none" stroke="#58a6ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="75" cy="172" r="24"/>
      <circle cx="175" cy="172" r="24"/>
      <circle cx="75" cy="172" r="2.2" fill="#58a6ff"/>
      <circle cx="175" cy="172" r="2.2" fill="#58a6ff"/>
      <path d="M75,172 L118,172 L98,146 L75,172"/>
      <path d="M98,146 L160,138 L118,172"/>
      <path d="M160,138 L175,172"/>
      <path d="M88,144 L106,142"/>
      <path d="M160,138 L166,124"/>
      <path d="M159,122 L176,120"/>
      <circle cx="118" cy="172" r="4.5" fill="#58a6ff"/>
      <path d="M118,172 L131,167"/>
      <path d="M127,164 L135,170"/>
    </g>

    <!-- rider body: seated on the saddle, leaning forward to the handlebar -->
    <g fill="none" stroke="#e6edf3" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M100,138 L152,92"/>
      <path d="M152,92 L172,122"/>
      <path d="M100,138 L128,148 L131,167"/>
    </g>
    <circle cx="162" cy="62" r="13" fill="#e6edf3"/>

    <!-- backpack worn on the back, tilted parallel to the spine, with a stopwatch knocked out in dark -->
    <g transform="translate(104,90) rotate(48)">
      <rect x="-27" y="-39" width="54" height="78" rx="8" fill="#3fb950"/>
      <circle cx="0" cy="0" r="21" fill="none" stroke="#0d1117" stroke-width="3.5"/>
      <line x1="0" y1="-21" x2="0" y2="-28" stroke="#0d1117" stroke-width="3" stroke-linecap="round"/>
      <rect x="-4.5" y="-34" width="9" height="6" rx="2" fill="#0d1117"/>
      <line x1="0" y1="0" x2="0" y2="-13" stroke="#0d1117" stroke-width="2.6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="9" y2="6" stroke="#0d1117" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2" fill="#0d1117"/>
    </g>
  </g>

  <!-- wordmark -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-weight="bold">
    <text x="250" y="96" font-size="46" fill="#e6edf3">toki<tspan fill="#3fb950">deli</tspan></text>
    <text x="250" y="128" font-size="17" fill="#8b949e" font-weight="normal">POSIX commands that deliver precise timing to your shell</text>
  </g>

  <!-- prompt accent -->
  <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="15" fill="#3fb950">
    <text x="250" y="156">$ cat data | valve -l 1s</text>
  </g>
</svg>
